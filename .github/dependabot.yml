version: 2
updates:
  # uv re-solves ci/uv.lock as a whole, so one update cannot clash with another package's needs.
  - package-ecosystem: uv
    directory: /ci
    schedule:
      interval: monthly
    allow:
      # The default covers only the packages ci/pyproject.toml names; this updates all of the lock.
      - dependency-type: all
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      all-frontend:
        patterns: ["*"]
    ignore:
      # Installs use the lockfile, so a major release reaches nobody until it is adopted
      # on purpose. Majors are upgraded by hand; this group carries minor and patch only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
