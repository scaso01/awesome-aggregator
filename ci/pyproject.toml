# Only for CI's pins in ci/uv.lock. Users install from requirements.txt and
# requirements-dev.txt, which stay the source: keep this list in step with them.
# A package added there but not here still installs in CI, just unpinned.
[project]
name = "awesome-aggregator-ci"
version = "0"
requires-python = ">=3.12"
dependencies = [
    # requirements.txt
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.11.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.0",
    "aiosqlite>=0.21.0",
    "apscheduler>=3.10.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "websockets>=14.0",
    # requirements-dev.txt
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "aioresponses>=0.7.0",
    "respx>=0.22.0",
    "playwright>=1.48.0",
    "pyflakes>=3.2.0",
]

[tool.uv]
package = false
