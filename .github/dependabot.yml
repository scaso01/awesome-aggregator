version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      all-frontend:
        patterns: ["*"]
    ignore:
      # Installs use the lockfile, so a major release reaches nobody until it is adopted
      # on purpose. Majors are upgraded by hand; this group carries minor and patch only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
