# Awesome Aggregator - RSSHub Stack
# Provides RSS feeds for 1000+ platforms (Pinterest, Instagram, Twitter, etc.)
#
# Usage:
#   docker compose up -d        # Start RSSHub
#   docker compose down          # Stop
#   docker compose logs rsshub   # View logs
#
# Access: http://localhost:1200
# Example: http://localhost:1200/pinterest/user/<username>

services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: always
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - TZ=America/New_York
      - CACHE_TYPE=memory
      - CACHE_EXPIRE=300
      - CACHE_CONTENT_EXPIRE=3600
      - ALLOW_USER_SUPPLY_UNSAFE_DOMAIN=true
      # Uncomment and add credentials for authenticated platforms:
      # - TWITTER_AUTH_TOKEN=
      # - IG_USERNAME=
      # - IG_PASSWORD=
      # - YOUTUBE_KEY=
      # - GITHUB_ACCESS_TOKEN=
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:1200/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
